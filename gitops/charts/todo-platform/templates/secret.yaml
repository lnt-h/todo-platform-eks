{{- /*
Only for local clusters. Real environments set database.existingSecret and the
Secret comes from AWS Secrets Manager via External Secrets, never from Git.
*/}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  labels:
    {{- include "todo-platform.labels" (dict "root" $ "name" "db-credentials") | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "set database.password or database.existingSecret" .Values.database.password | quote }}
{{- end }}
