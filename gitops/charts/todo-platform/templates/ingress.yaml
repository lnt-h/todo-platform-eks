{{- if .Values.ingress.enabled }}
# Entry point from outside the cluster. All traffic goes to the frontend;
# its nginx forwards /api/todos and /api/users to the two services.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-platform
  labels:
    {{- include "todo-platform.labels" (dict "root" $ "name" "frontend") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
{{- end }}
