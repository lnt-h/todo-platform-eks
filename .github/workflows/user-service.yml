name: user-service

on:
  push:
    branches: [main]
    paths:
      - "apps/user-service/**"
      - ".github/workflows/user-service.yml"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "apps/user-service/**"
      - ".github/workflows/user-service.yml"
      - ".github/workflows/docker-image.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/user-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/user-service/package-lock.json

      # npm ci: clean install exactly what package-lock.json says.
      - name: Install
        run: npm ci

      # Typecheck + unit tests with coverage (see package.json).
      - name: Test
        run: npm test

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      name: user-service
      context: apps/user-service
